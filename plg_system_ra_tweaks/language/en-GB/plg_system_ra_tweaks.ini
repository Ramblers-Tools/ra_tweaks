PLG_SYSTEM_RA_TWEAKS="System - RA Tweaks"
PLG_SYSTEM_RA_TWEAKS_XML_DESCRIPTION="East Cheshire Ramblers site tweaks plugin."
PLG_SYSTEM_RA_TWEAKS_FIELDSET_CHANGED_WALK_HIGHLIGHTING_LABEL="Changed Walk Highlighting"
PLG_SYSTEM_RA_TWEAKS_FIELDSET_CHANGED_WALK_HIGHLIGHTING_DESC="Highlights walk titles marked as changed, while avoiding cancelled walks."
PLG_SYSTEM_RA_TWEAKS_FIELDSET_MISC_TWEAKS_LABEL="Miscellaneous Tweaks"
PLG_SYSTEM_RA_TWEAKS_FIELDSET_MISC_TWEAKS_DESC="Small display adjustments that do not need their own dedicated section yet."
PLG_SYSTEM_RA_TWEAKS_FIELD_MARKER_LABEL="Changed marker"
PLG_SYSTEM_RA_TWEAKS_FIELD_MARKER_DESC="Text that identifies a changed walk title, for example ***."
PLG_SYSTEM_RA_TWEAKS_FIELD_COLOUR_LABEL="Highlight colour"
PLG_SYSTEM_RA_TWEAKS_FIELD_COLOUR_DESC="Colour applied to changed walk titles that are not cancelled."
PLG_SYSTEM_RA_TWEAKS_FIELD_CANCEL_TERMS_LABEL="Cancelled terms"
PLG_SYSTEM_RA_TWEAKS_FIELD_CANCEL_TERMS_DESC="Comma-separated words that identify cancelled walks. Matching items will not receive the changed-walk colour."
PLG_SYSTEM_RA_TWEAKS_FIELD_ALIGN_GRADE_ICONS_LABEL="Align walk grade icons"
PLG_SYSTEM_RA_TWEAKS_FIELD_ALIGN_GRADE_ICONS_DESC="Keep programme walk title wrapping aligned under the title text, with the grade icon centred beside the text block."
PLG_SYSTEM_RA_TWEAKS_FIELD_DIARY_CATEGORY_ICONS_LABEL="Diary Dates category icons"
PLG_SYSTEM_RA_TWEAKS_FIELD_DIARY_CATEGORY_ICONS_DESC="Add a coloured category icon to the left of each Diary Dates entry (Committee Meeting, Social Event, Training, Weekend Away, Coach Trip, Themed Walk), looked up from the event's category in the database."
PLG_SYSTEM_RA_TWEAKS_FIELDSET_WALK_TYPE_LABELLING_LABEL="Walk Type Labelling"
PLG_SYSTEM_RA_TWEAKS_FIELDSET_WALK_TYPE_LABELLING_DESC="Automatically adds a coloured walk type label (Stroller, Short, Medium or Long Walk) to the end of programme walk titles, based on the walk's mileage."
PLG_SYSTEM_RA_TWEAKS_FIELD_WALK_TYPE_LABELS_LABEL="Add walk type labels"
PLG_SYSTEM_RA_TWEAKS_FIELD_WALK_TYPE_LABELS_DESC="Append the walk type (based on mileage) to the end of each programme walk title, in the matching colour below."
PLG_SYSTEM_RA_TWEAKS_FIELD_STROLLER_MAX_LABEL="Stroller max miles"
PLG_SYSTEM_RA_TWEAKS_FIELD_STROLLER_MAX_DESC="Walks up to and including this many miles are labelled STROLLER."
PLG_SYSTEM_RA_TWEAKS_FIELD_STROLLER_COLOUR_LABEL="Stroller colour"
PLG_SYSTEM_RA_TWEAKS_FIELD_STROLLER_COLOUR_DESC="Colour used for the STROLLER label."
PLG_SYSTEM_RA_TWEAKS_FIELD_SHORT_MAX_LABEL="Short walk max miles"
PLG_SYSTEM_RA_TWEAKS_FIELD_SHORT_MAX_DESC="Walks above the stroller maximum, up to and including this many miles, are labelled SHORT WALK."
PLG_SYSTEM_RA_TWEAKS_FIELD_SHORT_COLOUR_LABEL="Short walk colour"
PLG_SYSTEM_RA_TWEAKS_FIELD_SHORT_COLOUR_DESC="Colour used for the SHORT WALK label."
PLG_SYSTEM_RA_TWEAKS_FIELD_MEDIUM_MAX_LABEL="Medium walk max miles"
PLG_SYSTEM_RA_TWEAKS_FIELD_MEDIUM_MAX_DESC="Walks above the short walk maximum, up to and including this many miles, are labelled MEDIUM WALK."
PLG_SYSTEM_RA_TWEAKS_FIELD_MEDIUM_COLOUR_LABEL="Medium walk colour"
PLG_SYSTEM_RA_TWEAKS_FIELD_MEDIUM_COLOUR_DESC="Colour used for the MEDIUM WALK label."
PLG_SYSTEM_RA_TWEAKS_FIELD_LONG_COLOUR_LABEL="Long walk colour"
PLG_SYSTEM_RA_TWEAKS_FIELD_LONG_COLOUR_DESC="Colour used for the LONG WALK label, applied to any walk above the medium walk maximum."
PLG_SYSTEM_RA_TWEAKS_FIELD_EVENING_COLOUR_LABEL="Evening walk colour"
PLG_SYSTEM_RA_TWEAKS_FIELD_EVENING_COLOUR_DESC="Colour used for the EVENING WALK label. Add \"- EVENING WALK\" anywhere in the walk title and it will be moved to the end and coloured; mileage bands are not applied to evening walks."
PLG_SYSTEM_RA_TWEAKS_FIELD_EMAIL_FORM_CAPTCHA_LABEL="Spam check on contact emails"
PLG_SYSTEM_RA_TWEAKS_FIELD_EMAIL_FORM_CAPTCHA_DESC="Adds the site's captcha (Global Configuration > Default Captcha) to the Ramblers Tools email form used by the Email buttons on contact pages, which anyone can use. Joomla checks it when the message is sent. Does nothing when no captcha is set."
PLG_SYSTEM_RA_TWEAKS_FIELD_WALK_LINKS_LABEL="Open walks from links"
PLG_SYSTEM_RA_TWEAKS_FIELD_WALK_LINKS_DESC="When a page address ends in #walk= and a walk ID (as the Ramblers Tools app links to walks), open that walk's details as if it had been clicked. The walk must be listed on the page."

PLG_SYSTEM_RA_TWEAKS_FIELDSET_WALK_ROUTES_LABEL="Walk Routes"
PLG_SYSTEM_RA_TWEAKS_FIELDSET_WALK_ROUTES_DESC="Lets walk leaders attach a GPX file to a walk. The walk's popup then shows View route and Download GPX buttons. Put {ra_walk_route_upload} in an article for leaders (give it the leaders' access level) and {ra_walk_route} in an article for everyone, then enter that article's address below."
PLG_SYSTEM_RA_TWEAKS_FIELD_WALK_ROUTES_LABEL="Enable walk routes"
PLG_SYSTEM_RA_TWEAKS_FIELD_WALK_ROUTES_DESC="Switch on the route upload page, route map page and popup buttons."
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_GROUP_LABEL="Walk leaders group"
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_GROUP_DESC="Members of this user group can attach routes to walks. Super Users can always do so."
PLG_SYSTEM_RA_TWEAKS_OPTION_CHOOSE_GROUP="- Choose a group -"
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_GROUP_CODES_LABEL="Walks Manager group code(s)"
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_GROUP_CODES_DESC="Group code(s) whose walks leaders can choose from, for example CH02. Separate several with commas. Leave blank to use the home group set in Ramblers Tools."
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_PAGE_LABEL="Route page address"
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_PAGE_DESC="Address of the article that contains {ra_walk_route}, for example /walk-route.html. If blank, the popup only shows Download GPX."
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_MAX_MB_LABEL="Largest GPX file (MB)"
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_MAX_MB_DESC="Files bigger than this are refused. Your server may set a lower limit."
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_WEEKS_LABEL="Weeks of walks to list"
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_WEEKS_DESC="How far ahead leaders can pick a walk to attach a route to."
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_KEEP_DAYS_LABEL="Keep routes after the walk (days)"
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_KEEP_DAYS_DESC="A route is deleted automatically this many days after its walk. 0 keeps routes for ever, so past walks keep their routes."
PLG_SYSTEM_RA_TWEAKS_FIELD_RECORDINGS_LABEL="Routes recorded with the app"
PLG_SYSTEM_RA_TWEAKS_FIELD_RECORDINGS_DESC="Members can record a group walk with the Ramblers Tools app and send the route here (needs Ramblers Tools 4.5.0 or later). One recording per walk is shown as the route walked, without the recorder's name: the first from the walk leaders group, otherwise the longest, unless a walk leader picks another. Put {ra_walk_recordings} in an article for the page where members delete theirs and walk leaders choose the one shown. Times are removed and the ends are cut back to the walk's start and finish."
PLG_SYSTEM_RA_TWEAKS_FIELD_RECORDING_GROUP_LABEL="Who can record"
PLG_SYSTEM_RA_TWEAKS_FIELD_RECORDING_GROUP_DESC="Members of this user group can send recorded routes from the app. Registered means every member with a website account."
PLG_SYSTEM_RA_TWEAKS_FIELDSET_PAST_WALKS_LABEL="Past walks"
PLG_SYSTEM_RA_TWEAKS_FIELDSET_PAST_WALKS_DESC="Put {ra_past_walks} in an article to list the group's past walks, newest first, like the walks programme. Walks come from Walks Manager and are kept on this site a year at a time. Cancelled walks are left out, and only the leader's name is kept (no phone number or contact form)."
PLG_SYSTEM_RA_TWEAKS_FIELD_PAST_WALKS_FROM_LABEL="First year"
PLG_SYSTEM_RA_TWEAKS_FIELD_PAST_WALKS_FROM_DESC="The earliest year to list. Walks Manager has East Cheshire walks from August 2023."
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_DEFAULT_MAP_LABEL="Map shown first"
PLG_SYSTEM_RA_TWEAKS_FIELD_ROUTES_DEFAULT_MAP_DESC="The map a route opens on. Visitors can still switch with the layers button on the map. The Ordnance Survey maps only appear if the Ramblers library has an OS key."
PLG_SYSTEM_RA_TWEAKS_FIELDSET_MAPS_LABEL="Maps"
PLG_SYSTEM_RA_TWEAKS_FIELDSET_MAPS_DESC="The Ramblers library draws its Ordnance Survey maps with a key shared by every Ramblers website. Enter the club's own Ordnance Survey key below to use that instead. This covers the walk route maps and any other map the library draws."
PLG_SYSTEM_RA_TWEAKS_FIELD_OS_KEY_LABEL="Club Ordnance Survey key"
PLG_SYSTEM_RA_TWEAKS_FIELD_OS_KEY_DESC="Paste the key from your project in the OS Data Hub (os.uk/data-hub). The project needs OS Maps API and OS Vector Tile API. Leave blank to keep using the Ramblers library's shared key. The key shows in the page source, so only use one made for this website."
